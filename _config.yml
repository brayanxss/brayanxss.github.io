title: "Octocat"
description: "Desenvolvedor, criador e entusiasta de tecnologia."
url: "https://seuusuario.github.io"
baseurl: ""

author:
  name: "Octocat"
  avatar: "/assets/img/avatar.png"
  bio: "Construindo projetos, explorando tecnologia e contribuindo para o open source."

# Tema
theme: jekyll-theme-minimal

# Idioma
lang: pt-BR

# Social
social:
  github: "seuusuario"
  linkedin: "seuusuario"
  twitter: "seuusuario"

# Navegação
navigation:
  - title: "Início"
    url: "/"
  - title: "Sobre"
    url: "/#sobre"
  - title: "Projetos"
    url: "/#projetos"
  - title: "Contato"
    url: "/#contato"

# Projetos
projects:
  - name: "Projeto Alpha"
    description: "Uma aplicação moderna construída para resolver problemas reais."
    technologies:
      - "JavaScript"
      - "React"
      - "API"
    url: "https://github.com/seuusuario/projeto-alpha"

  - name: "Projeto Beta"
    description: "Projeto open source focado em automação e produtividade."
    technologies:
      - "Python"
      - "FastAPI"
      - "Docker"
    url: "https://github.com/seuusuario/projeto-beta"

# SEO
seo:
  title: "Octocat — Desenvolvedor"
  description: "Portfólio e projetos de Octocat."

# Markdown
markdown: kramdown

# Plugins
plugins:
  - jekyll-seo-tag

# Build
exclude:
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
