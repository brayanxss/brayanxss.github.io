<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Laboratório de autenticação</title>
</head>
<body>
  <main>
    <h1>Laboratório de autenticação</h1>

    <p id="status">Consultando sessão...</p>

    <p>
      <a href="/oauth/login/google">Entrar com Google</a>
    </p>

    <p>
      <a href="/oauth/login/github">Entrar com GitHub</a>
    </p>

    <button id="logout" type="button">Sair</button>
  </main>

  <script>
    fetch("/api/me", {
      credentials: "same-origin"
    })
      .then((response) => {
        if (!response.ok) {
          return null;
        }

        return response.json();
      })
      .then((user) => {
        const status = document.getElementById("status");

        if (user && user.authenticated) {
          status.textContent =
            `Sessão ativa: ${user.email ?? user.displayName ?? user.subject}`;
        } else {
          status.textContent =
            "Nenhuma sessão neste navegador.";
        }
      })
      .catch(() => {
        document.getElementById("status").textContent =
          "Não foi possível consultar a sessão.";
      });

    document.getElementById("logout").addEventListener("click", async () => {
      try {
        const response = await fetch("/oauth/logout", {
          method: "POST",
          credentials: "same-origin"
        });

        if (response.ok) {
          window.location.href = "/";
        }
      } catch {
        document.getElementById("status").textContent =
          "Não foi possível sair.";
      }
    });
  </script>
</body>
</html>
