name: migrar-d1

on:
  push:
    branches:
      - main
    paths:
      - "migrations/**"
      - ".github/workflows/migrar.yml"

permissions:
  contents: read

jobs:
  migrar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar repositório
        uses: actions/checkout@v6

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar Wrangler
        run: npm install --global wrangler

      - name: Aplicar migrações no D1 remoto
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler d1 migrations apply oauth-sessions-equipe --remote
