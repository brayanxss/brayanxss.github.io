
name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar Copilot CLI
        run: npm install -g @github/copilot

      - name: Preparar diff do Pull Request
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          git diff "origin/${BASE_REF}...HEAD" > diff.txt

          {
            echo "Revise as alterações deste Pull Request em português."
            echo "Procure SQL injection, segredos expostos, falhas de autenticação e validação insuficiente."
            echo "Explique o risco e sugira correções apenas para problemas comprovados."
            echo
            echo "Alterações:"
            head -c 20000 diff.txt
          } > prompt.txt

      - name: Revisão por IA
        id: ia
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt.txt
          model: gpt-4.1

      - name: Verificar resposta da IA
        env:
          RESPOSTA: ${{ steps.ia.outputs.response }}
        run: |
          if [ -z "$RESPOSTA" ]; then
            echo "::error::A IA retornou uma resposta vazia."
            exit 1
          fi

          echo "A revisão por IA foi concluída."

      - name: Comentar no Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESPONSE_FILE: ${{ steps.ia.outputs.response-file }}
        run: |
          if [ -z "$RESPONSE_FILE" ] || [ ! -f "$RESPONSE_FILE" ]; then
            echo "::error::O arquivo de resposta da IA não foi encontrado."
            exit 1
          fi

          gh pr comment "$PR_NUMBER" --body-file "$RESPONSE_FILE"
