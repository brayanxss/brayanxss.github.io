
name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar Copilot CLI
        run: npm install -g @github/copilot

      - name: Montar prompt com as alterações
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo "Revise as alterações deste Pull Request como revisor de segurança."
            echo "Procure SQL injection, segredos expostos, falhas de autenticação,"
            echo "validação insuficiente de entradas e problemas de segurança."
            echo "Explique os riscos e sugira correções. Não invente problemas."
            echo
            git diff "origin/$BASE_REF...HEAD" | head -c 20000 || true
          } > prompt.txt

      - name: Revisar com IA
        id: ia
        uses: actions/ai-inference@v1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt.txt
          system-prompt: Você é um revisor de código objetivo e especializado em segurança.

      - name: Comentar no Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESPONSE_FILE: ${{ steps.ia.outputs.response-file }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file "$RESPONSE_FILE"
