
name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6

      - name: Instalar Copilot CLI
        run: npm install -g @github/copilot

      - name: Revisar com IA
        id: ia
        uses: actions/ai-inference@v3
        with:
          prompt: |
            Revise as alterações deste Pull Request como um revisor
            de segurança. Identifique problemas reais, explique os riscos
            e sugira correções. Não invente problemas.
          model: gpt-4.1
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
