
name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Configurar Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar Copilot CLI
        run: npm install -g @github/copilot

      - name: Montar o prompt
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo "Revise as alterações deste Pull Request como um revisor de segurança."
            echo "Procure SQL injection, segredos expostos, falhas de autenticação,"
            echo "validação insuficiente de entradas e problemas de segurança."
            echo "Seja crítico e objetivo. Explique o risco e sugira correções."
            echo "Não invente problemas sem evidências."
            echo
            echo "DIFF DO PULL REQUEST:"
            git diff "origin/$BASE_REF...HEAD" | head -c 20000 || true
          } > prompt.txt

      - name: Revisar com IA
        id: ia
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt.txt
          system-prompt: Você é um revisor de código objetivo e especializado em segurança.
          model: claude-sonnet-4.5

      - name: Comentar no Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESPONSE_FILE: ${{ steps.ia.outputs.response-file }}
        run: |
          if [ -z "$RESPONSE_FILE" ] || [ ! -f "$RESPONSE_FILE" ]; then
            echo "A IA não gerou o arquivo de resposta esperado."
            exit 1
          fi

          gh pr comment "$PR_NUMBER" --body-file "$RESPONSE_FILE"
