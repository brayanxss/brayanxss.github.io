name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Baixar código
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Preparar diff do PR
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          git diff "$BASE" "$HEAD" > diff-pr.txt

      - name: Configurar Node.js
        uses: actions/setup-node@v6

      - name: Instalar Copilot CLI
        run: npm install -g @github/copilot

      - name: Revisar alterações com IA
        id: ia
        uses: actions/ai-inference@v3
        with:
          model: gpt-4.1
          prompt: |
            Faça uma revisão de segurança do Pull Request.
            Analise o diff anexado, procure SQL injection, segredos
            expostos, falhas de autenticação e validação insuficiente.
            Explique apenas problemas sustentados por evidências.
          file_input: |
            diff: diff-pr.txt
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}

      - name: Comentar revisão no PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW: ${{ steps.ia.outputs.response }}
        run: |
          gh pr comment "$PR_NUMBER" --body "$REVIEW"
