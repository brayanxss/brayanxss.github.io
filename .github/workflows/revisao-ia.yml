
      - name: Instalar Copilot CLI
        run: npm install -g @github/copilot

      - name: Revisar alterações do Pull Request com IA
        id: ia
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt: |
            Revise as alterações deste Pull Request como um revisor de segurança.
            Procure SQL injection, segredos expostos, falhas de autenticação,
            validação insuficiente de entradas e problemas de segurança.
            Seja crítico e objetivo. Explique os riscos e sugira correções.
            Não invente problemas sem evidências.
          model: ''

      - name: Comentar revisão no Pull Request
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REVIEW: ${{ steps.ia.outputs.response }}
        run: |
          gh pr comment "$PR_NUMBER" --body "$REVIEW"
