
name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Instalar Copilot CLI
        run: npm install -g @github/copilot

      - name: Testar Copilot
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        run: |
          copilot -p "Responda apenas: teste funcionando"
