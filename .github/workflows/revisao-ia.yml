name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write
  models: read

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - name: Revisar alterações do Pull Request com IA
        uses: actions/ai-inference@v1
        with:
          prompt: |
            Revise as alterações deste Pull Request como um revisor de segurança.
            Procure SQL injection, segredos expostos, falhas de autenticação,
            validação insuficiente de entradas e problemas de segurança.
            Seja crítico e objetivo. Se encontrar problemas, explique o risco
            e sugira uma correção. Não invente problemas sem evidências.
          model: openai/gpt-4o
