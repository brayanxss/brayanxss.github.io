
name: revisao-ia

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write
  issues: write

jobs:
  revisar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Instalar Copilot CLI
        run: npm install -g @github/copilot

      - name: Montar prompt
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          {
            echo "Revise o diff deste site com Cloudflare Pages Functions e D1."
            echo "Procure segredos expostos, SQL injection e erros de lógica."
            echo "Sugira correções e não invente problemas."
            echo '```diff'
            git diff "origin/$BASE_REF...HEAD" | head -c 20000 || true
            echo
            echo '```'
          } > prompt.txt

      - name: Revisar com IA
        id: ia
        uses: actions/ai-inference@v3
        env:
          COPILOT_GITHUB_TOKEN: ${{ secrets.COPILOT_PAT }}
        with:
          prompt-file: prompt.txt
          system-prompt: Você é um revisor de código objetivo.
          model: auto

      - name: Comentar no PR
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          RESPONSE_FILE: ${{ steps.ia.outputs.response-file }}
        run: |
          gh pr comment "$PR_NUMBER" --body-file "$RESPONSE_FILE"
